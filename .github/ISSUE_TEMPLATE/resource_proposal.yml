name: 📚 Resource Proposal
description: Propose a new resource to add to this vault.
title: "proposal: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        You may write in **English, বাংলা, 简体中文, 日本語, Русский, Español, or Deutsch** — we will reply in the same language when possible.
        Keep commands, file paths, URLs, identifiers, and error output exactly as written; do not translate them.
        One proposal per issue. Required fields must be completed.

  - type: dropdown
    id: language
    attributes:
      label: Language
      description: Records your preferred reply language.
      options:
        - English
        - বাংলা (Bengali)
        - 简体中文 (Simplified Chinese)
        - 日本語 (Japanese)
        - Русский (Russian)
        - Español (Spanish)
        - Deutsch (German)
      default: 0
    validations:
      required: true

  - type: input
    id: resource-name
    attributes:
      label: Resource name
      description: Short, descriptive name.
      placeholder: Safe JSON parser
    validations:
      required: true

  - type: input
    id: source-url
    attributes:
      label: Resource URL
      description: Link to the upstream repository, documentation, or source.
      placeholder: https://github.com/BurntSushi/ripgrep
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Tool
        - Library
        - Guide or tutorial
        - Article
        - Dataset
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What is it?
      description: Describe the resource and the problem it solves.
    validations:
      required: true

  - type: textarea
    id: fit
    attributes:
      label: Why should it be added?
      description: How is it reusable across projects rather than tied to one codebase?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Optional. Existing resources or approaches you considered instead.
    validations:
      required: false

  - type: textarea
    id: example-usage
    attributes:
      label: Example usage
      description: Optional. A short runnable example, kept unchanged.
      render: shell
    validations:
      required: false

  - type: input
    id: technologies
    attributes:
      label: Related technologies
      description: Optional. Runtime, language, or tool versions involved.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional. Constraints, portability limits, or security considerations.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      description: Both confirmations are required before submitting.
      options:
        - label: I have checked that this resource is not already in the vault.
          required: true
        - label: I have verified that the resource is actively maintained and the link is correct.
          required: true
