name: ✨ Improvement
description: Suggest an improvement to an existing resource.
title: "improvement: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        You may write in **English, বাংলা, 简体中文, 日本語, Русский, Español, or Deutsch** — we will reply in the same language when possible.
        Keep commands, file paths, URLs, identifiers, and error output exactly as written; do not translate them.
        One issue per report. Required fields must be completed.

  - type: dropdown
    id: language
    attributes:
      label: Language
      description: Records your preferred reply language.
      options:
        - English
        - বাংলা (Bengali)
        - 简体中文 (Simplified Chinese)
        - 日本語 (Japanese)
        - Русский (Russian)
        - Español (Spanish)
        - Deutsch (German)
      default: 0
    validations:
      required: true

  - type: input
    id: affected-resource
    attributes:
      label: Affected resource
      description: Path to the file or directory involved.
      placeholder: scripts/git-cleanup.sh
    validations:
      required: true

  - type: textarea
    id: limitation
    attributes:
      label: Current state
      description: What is painful, slow, risky, or missing today? Concrete examples beat general statements.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: What should change, and how would it work?
    validations:
      required: true

  - type: textarea
    id: benefits
    attributes:
      label: Benefits
      description: What improves, and for whom.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Optional. Other approaches you considered.
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Pick the area the proposal mainly changes.
      options:
        - Repository structure
        - Workflows and CI
        - Automation and tooling
        - Issue and PR templates
        - Documentation standards
        - Security and secrets handling
        - Linting and formatting
        - Developer experience
        - Other
    validations:
      required: true

  - type: textarea
    id: considerations
    attributes:
      label: Implementation considerations
      description: Optional. Trade-offs, migration cost, or breaking changes.
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References
      description: Optional. Prior art, specs, or links to similar implementations.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional. Anything else that helps evaluate the proposal.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      description: Both confirmations are required before submitting.
      options:
        - label: I have checked that this improvement has not already been proposed.
          required: true
        - label: I have removed secrets, tokens, passwords, and other sensitive information.
          required: true
