name: 🐞 Bug Report
description: Report a broken, incorrect, or outdated resource.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        You may write in **English, বাংলা, 简体中文, 日本語, Русский, Español, or Deutsch** — we will reply in the same language when possible.
        Keep commands, file paths, URLs, identifiers, and error output exactly as written; do not translate them.
        One issue per report. Required fields must be completed.

  - type: dropdown
    id: language
    attributes:
      label: Language
      description: Records your preferred reply language.
      options:
        - English
        - বাংলা (Bengali)
        - 简体中文 (Simplified Chinese)
        - 日本語 (Japanese)
        - Русский (Russian)
        - Español (Spanish)
        - Deutsch (German)
      default: 0
    validations:
      required: true

  - type: input
    id: affected-resource
    attributes:
      label: Affected resource
      description: Path to the file or directory involved.
      placeholder: scripts/git-cleanup.sh
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is broken, incorrect, or outdated.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead.
      render: shell
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal steps that reliably trigger the problem.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Error messages, logs, or stack traces, pasted exactly as produced.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Environment context
      description: Operating system, runtime and version, and shell.
      placeholder: |
        OS: Ubuntu 24.04
        Runtime: Node 22.11.0
        Shell: bash 5.2
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      description: Both confirmations are required before submitting.
      options:
        - label: I have checked that this issue has not already been reported.
          required: true
        - label: I have removed secrets, tokens, passwords, and other sensitive information.
          required: true
