name: 📝 Documentation Issue
description: Report unclear, incorrect, or missing documentation.
title: "docs: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        You may write in **English, বাংলা, 简体中文, 日本語, Русский, Español, or Deutsch** — we will reply in the same language when possible.
        Keep commands, file paths, URLs, identifiers, and error output exactly as written; do not translate them.
        One issue per report. Required fields must be completed.

  - type: dropdown
    id: language
    attributes:
      label: Language
      description: Records your preferred reply language.
      options:
        - English
        - বাংলা (Bengali)
        - 简体中文 (Simplified Chinese)
        - 日本語 (Japanese)
        - Русский (Russian)
        - Español (Spanish)
        - Deutsch (German)
      default: 0
    validations:
      required: true

  - type: input
    id: affected-document
    attributes:
      label: Affected documentation
      description: File path, URL, or heading.
      placeholder: docs/install.md
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: Issue type
      options:
        - Incorrect or outdated information
        - Missing information
        - Broken link or reference
        - Unclear explanation
        - Formatting or consistency
        - Translation quality
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong, and where. Quote the affected text if it helps.
    validations:
      required: true

  - type: textarea
    id: suggested-fix
    attributes:
      label: Expected documentation
      description: The wording or structure you expected to find.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Optional. Links or upstream documentation supporting the correction.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional. Anything else that helps triage.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      description: Both confirmations are required before submitting.
      options:
        - label: I have checked that this documentation issue has not already been reported.
          required: true
        - label: I have removed secrets, tokens, passwords, and other sensitive information.
          required: true
