name: Secret Scan

# Blocks committed credentials before they can spread. Scans the full Git
# history, not just the working tree, because a secret removed in a later
# commit is still exposed in history.
#
# gitleaks is installed from a pinned release with checksum verification, so
# the scan cannot change behaviour without a deliberate version bump.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly re-scan catches rules added upstream after the last commit.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "/tmp/${archive}" "${base}/${archive}"
          curl -sSfL -o /tmp/gitleaks_checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          expected="$(grep " ${archive}$" /tmp/gitleaks_checksums.txt | awk '{print $1}')"
          actual="$(sha256sum "/tmp/${archive}" | awk '{print $1}')"
          if [ -z "${expected}" ] || [ "${expected}" != "${actual}" ]; then
            echo "::error::checksum verification failed for ${archive}"
            exit 1
          fi
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan Git history for secrets
        run: |
          set -euo pipefail
          gitleaks git . \
            --config .github/linters/.gitleaks.toml \
            --redact \
            --verbose \
            --no-banner
